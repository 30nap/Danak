name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      dump_screenshots:
        description: "Also print downscaled screenshots into the log (for reviewers without artifact access)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Print lint findings
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || echo "no lint text report"

      # Minified and resource-shrunk, like a real release; unsigned because no key lives in CI.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease

      - name: Summary
        if: always()
        run: |
          {
            echo "## Danak build"
            APK=app/build/outputs/apk/debug/app-debug.apk
            if [ -f "$APK" ]; then
              echo "- Debug APK: $(du -h "$APK" | cut -f1)"
            else
              echo "- Debug APK: **not built**"
            fi
            REL=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
            [ -n "$REL" ] && echo "- Release APK (R8, unsigned): $(du -h "$REL" | cut -f1)"
            [ -f app/build/reports/lint-results-debug.txt ] && echo "- Lint: $(tail -1 app/build/reports/lint-results-debug.txt)"
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" \
                | sed 's/^/- /'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: danak-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  ui-tests:
    name: UI tests on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (normal and large font)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The emulator runner executes each line on its own, so every step is one line.
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb shell settings put system font_scale 1.3
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=ir.danak.app.AppJourneyTest -Pandroid.testInstrumentationRunnerArguments.screenshotPrefix=font130_
            adb shell settings put system font_scale 1.0
            mkdir -p ui-output && adb exec-out run-as ir.danak.app.debug tar -c -C files screenshots > ui-output/screenshots.tar || true
            cd ui-output && tar -xf screenshots.tar && rm screenshots.tar || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Danak UI tests"
            n=$(ls ui-output/screenshots/*.png 2>/dev/null | wc -l)
            echo "- Screenshots captured: $n"
            if [ -f ui-output/screenshots/a11y-report.txt ]; then
              echo "### Accessibility audit"
              echo '```'
              cat ui-output/screenshots/a11y-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat ui-output/screenshots/a11y-report.txt 2>/dev/null || true

      - name: Dump screenshots into the log
        # Opt in from the Actions UI, or by putting [screenshots] in the pushed commit message.
        if: always() && (inputs.dump_screenshots || contains(github.event.head_commit.message, '[screenshots]'))
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob("ui-output/screenshots/*.png")):
              im = Image.open(path).convert("RGB")
              im.thumbnail((360, 800))
              buf = io.BytesIO()
              im.save(buf, "JPEG", quality=70)
              print(f"=====BEGIN {os.path.basename(path)}=====")
              print(base64.b64encode(buf.getvalue()).decode())
              print(f"=====END {os.path.basename(path)}=====")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-screenshots
          path: ui-output/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
