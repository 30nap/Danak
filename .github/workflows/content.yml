name: Content

# Validates Danak content on every change to it, and publishes it to GitHub Pages from the
# default branch. Publishing happens only after validation passes, and only from a push or a
# manual run on the default branch; pull requests are validated and built, never deployed.

on:
  push:
    paths:
      - "content/**"
      - "schema/**"
      - "tools/danak_content.py"
      - "tools/check_links.py"
      - "tests/content/**"
      - "app/src/main/assets/content/**"
      - "app/src/main/java/ir/danak/app/data/**"
      - "app/src/test/java/ir/danak/app/LiveSiteTest.kt"
      - ".github/workflows/content.yml"
  pull_request:
    paths:
      - "content/**"
      - "schema/**"
      - "tools/danak_content.py"
      - "tools/check_links.py"
      - "tests/content/**"
      - "app/src/main/assets/content/**"
      - "app/src/main/java/ir/danak/app/data/**"
      - "app/src/test/java/ir/danak/app/LiveSiteTest.kt"
      - ".github/workflows/content.yml"
  schedule:
    # Weekly, so a source article that moves or disappears is noticed.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install validator dependencies
        run: pip install --quiet jsonschema pyyaml

      - name: Validator tests (valid and intentionally invalid fixtures)
        run: python3 -m unittest discover -s tests/content -v

      - name: Validate content/
        run: python3 tools/danak_content.py validate

      - name: App bundle is an exact copy of reviewed content
        run: python3 tools/danak_content.py check-bundle

      - name: Build the static site
        run: |
          python3 tools/danak_content.py build --out _site
          {
            echo "## Published content"
            echo "- Danaks: $(python3 -c 'import json; print(len(json.load(open("_site/v1/index.json"))["danaks"]))')"
            echo "- Files: $(find _site -type f | wc -l), $(du -sh _site | cut -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the site for Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  links:
    name: Source links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check every source and photo-credit link
        run: python3 tools/check_links.py

  deploy:
    name: Publish to GitHub Pages
    needs: validate
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Published site reads back correctly
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet jsonschema pyyaml
      - name: Fetch the live index, every content file (hash-checked) and every image
        run: python3 tools/danak_content.py verify-site "${{ needs.deploy.outputs.page_url }}"

  android-client:
    name: The app's client syncs the live site
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Sync the live site with the app's own code (JVM)
        env:
          DANAK_LIVE_BASE_URL: ${{ needs.deploy.outputs.page_url }}v1/
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests ir.danak.app.LiveSiteTest -i | grep -E "live:|LiveSiteTest|FAILED|BUILD" || true
      - name: Fail if the live sync failed
        run: |
          f=app/build/test-results/testDebugUnitTest/TEST-ir.danak.app.LiveSiteTest.xml
          test -f "$f" && ! grep -q "<failure" "$f" && ! grep -q "<skipped" "$f"
